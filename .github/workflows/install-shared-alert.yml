name: Install shared system timer
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shared alert client
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          alert='  <script src="/lovely-system-alert.js"></script>\n'
          if 'src="/lovely-system-alert.js"' not in s:
              s=s.replace('</body>', alert+'</body>')
          p.write_text(s)
          PY
      - name: Commit installation
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Our Lovely System automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Load shared self-destruct timer"
          git push
